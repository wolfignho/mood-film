<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mood Film 🎬</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top,#2a1745,#0d0b14 60%);color:#f2eefa;min-height:100vh}
.w{max-width:560px;margin:auto;padding:22px 16px 60px}h1{font-size:1.8rem;margin:.2em 0}.sub{color:#b9a9d6;margin-top:0}
.bar{height:6px;background:#2b2440;border-radius:9px;margin:18px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4f8b,#ffb84f);border-radius:9px;transition:.3s}
.q{font-size:1.25rem;font-weight:700;margin:14px 0}.opts{display:grid;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}.o{background:#1c1730;border:1px solid #3a3058;border-radius:14px;padding:14px;text-align:left;font-size:1.05rem}.o:active,.o:hover{border-color:#ff4f8b;background:#281f42}
.card{background:#1a1529;border:1px solid #33294d;border-radius:18px;padding:16px;margin:14px 0;display:flex;gap:14px}.em{font-size:2.8rem;line-height:1}
.card h3{margin:0 0 4px}.meta{color:#b9a9d6;font-size:.88rem}.why{color:#ffd28a;font-size:.92rem;margin:8px 0}.pl{font-size:.9rem}.tag{font-size:.7rem;background:#3a3058;padding:2px 6px;border-radius:6px;margin-left:4px}
a.jw{display:inline-block;margin-top:8px;color:#ff7aa8;font-weight:600;text-decoration:none}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:0;font-weight:700;font-size:1.05rem;margin-top:10px;background:linear-gradient(90deg,#ff4f8b,#ffb84f);color:#1a0d1f}.ghost{background:#241d38;color:#f2eefa}
.back{background:none;border:0;color:#b9a9d6;margin-top:14px}
.poster{width:100%;max-height:520px;object-fit:contain;border-radius:14px;background:#000;margin-bottom:12px}.fiche{background:#1a1529;border:1px solid #33294d;border-radius:18px;padding:16px;margin:14px 0}.fiche h2{margin:0 0 4px}.row{margin:6px 0;font-size:.95rem}.row b{color:#b9a9d6;font-weight:600}.links a{display:inline-block;margin:8px 10px 0 0;color:#ff7aa8;font-weight:600;text-decoration:none}.src{font-size:.72rem;color:#7d6f99}</style></head><body><div class="w"><h1>🎬 Mood Film</h1><p class="sub">Dis-moi comment tu te sens, je te trouve ton film.</p><div id="app"></div></div>
<script src="data.js"></script>
<script>
const Q=[
{k:"mood",q:"Là, tout de suite, t'es comment ?",o:[["😎","Au top, plein d'énergie","up"],["😌","Tranquille, posé","calm"],["😮‍💨","Crevé, j'ai besoin de souffler","tired"],["😔","Un peu down","down"]]},
{k:"env",q:"T'as envie de quoi ce soir ?",o:[["😂","Rire","r"],["😱","Frissonner","f"],["🥹","Être ému","e"],["💥","De l'action","a"],["🤯","Réfléchir","t"]]},
{k:"who",q:"Tu regardes avec qui ?",o:[["🛋️","Solo","s"],["💑","En couple","c"],["🍕","Entre potes","p"],["👨‍👩‍👧","En famille","f"]]},
{k:"dur",q:"T'as combien de temps devant toi ?",o:[["⚡","Moins d'1h45","short"],["🕑","Jusqu'à 2h30","mid"],["🌙","J'ai toute la nuit","long"]]},
{k:"era",q:"Plutôt récent ou classique ?",o:[["🆕","Récent (2023 et +)","new"],["📼","Classique / culte","old"],["🤷","Peu importe","any"]]},
{k:"lang",q:"Côté langue ?",o:[["🇫🇷","Que du cinéma français","fr"],["🌍","Tout, en VF ou VO c'est ok","any"]]}];
const D=F.map(([t,y,m,e,g,em,p,l,pi])=>({t,y,m,e,g,em,p,l,pi}));
let A={},i=0,seen=new Set(),app=document.getElementById('app');
function ask(){const s=Q[i];app.innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${s.q}</div><div class="opts">${s.o.map((o,j)=>`<button class="o" onclick="pick(${j})">${o[0]} ${o[1]}</button>`).join('')}</div>${i?'<button class="back" onclick="i--;ask()">← Retour</button>':''}`}
function pick(j){A[Q[i].k]=Q[i].o[j][2];i++;i<Q.length?ask():show()}
const anim=g=>/Animation/.test(g),rom=g=>/Rom|musicale/.test(g);
function score(f){let s=0,r=[];if(f.e.includes(A.env)){s+=10;r.push({r:"ça va te faire rire",f:"ça va te foutre les frissons",e:"ça va te toucher",a:"ça envoie de l'action",t:"ça fait cogiter"}[A.env])}else return -1;
if(A.mood=="down"&&(f.e.includes("r")||f.e.includes("e"))){s+=3;r.push("parfait pour remonter le moral")}
if(A.mood=="tired"&&f.m<=115){s+=3;r.push("facile à regarder quand t'es crevé")}
if(A.mood=="up"&&f.e.includes("a")){s+=2;r.push("ça suit ton énergie")}
if(A.mood=="calm"&&f.e.includes("t")){s+=2}
if(A.who=="c"&&(rom(f.g)||f.e.includes("e"))){s+=3;r.push("top à deux")}
if(A.who=="p"&&(f.e.includes("r")||f.e.includes("a")||f.e.includes("f"))){s+=3;r.push("idéal entre potes")}
if(A.who=="f"){if(anim(f.g)||/Aventure|Fantasy/.test(f.g)){s+=4;r.push("ça passe pour toute la famille")}if(f.e.includes("f")&&/Horreur/.test(f.g))return -1}
if(A.who=="s"&&f.e.includes("t"))s+=2;
const lim={short:105,mid:150,long:999}[A.dur];if(f.m>lim)return -1;
if(A.era=="new"&&f.y<2023)return -1;if(A.era=="old"&&f.y>=2023)return -1;
if(A.lang=="fr"&&f.l!="fr")return -1;if(f.l=="fr")r.push("100 % français");
f.why=r.slice(0,3).join(", ");return s+Math.random()*4}
function show(){let c=D.map(f=>[score(f),f]).filter(x=>x[0]>0&&!seen.has(x[1].t)).sort((a,b)=>b[0]-a[0]).slice(0,1).map(x=>x[1]);
if(c.length<1){const extra=D.filter(f=>f.e.includes(A.env)&&!seen.has(f.t)&&!c.includes(f)&&(A.lang!="fr"||f.l=="fr")).sort(()=>Math.random()-.5).slice(0,1);extra.forEach(f=>f.why=f.why||"un bon plan dans ton envie, même si ça sort un peu de tes critères");c=c.concat(extra)}
if(!c.length){seen.clear();return show()}
c.forEach(f=>seen.add(f.t));
app.innerHTML=`<div class="bar"><i style="width:100%"></i></div><div class="q">Ton film ce soir 🍿</div>`+c.map(card).join('')+`<button class="btn" onclick="show()">🔀 Autre idée</button><button class="btn ghost" onclick="A={};i=0;seen.clear();ask()">↺ Recommencer</button><p class="meta" style="margin-top:16px">Les plateformes changent souvent : vérifie sur JustWatch avant de lancer.</p>`;scrollTo(0,0);c.forEach(enrich)}const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(f){const q=encodeURIComponent(f.t);return `<div class="fiche" id="fiche"><div id="pos" class="poster" style="display:flex;align-items:center;justify-content:center;font-size:5rem;height:220px">${f.em}</div><h2>${esc(f.t)}</h2><div class="meta">${f.y} · ${esc(f.g)} · <span id="dur">${Math.floor(f.m/60)}h${String(f.m%60).padStart(2,'0')}</span></div><div class="row" id="dir"></div><div class="row" id="cast"></div><p id="syn" style="margin:10px 0">${esc(f.pi)}</p><div class="why">👉 ${esc(f.why.charAt(0).toUpperCase()+f.why.slice(1))}</div><div class="row">📺 ${esc(f.p)}<span class="tag">dispo indicative</span></div><div class="links"><a target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(f.t+' '+f.y+' bande annonce')}">▶️ Bande-annonce</a><a target="_blank" href="https://www.justwatch.com/fr/recherche?q=${q}">Vérifier où le voir →</a><span id="note"></span></div><div class="src" id="src"></div></div>`}
const J=u=>fetch(u).then(r=>r.json());
async function enrich(f){try{
const r=await J(`https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrsearch=${encodeURIComponent(f.t+' film '+f.y)}&prop=pageimages|extracts|pageprops|info&inprop=url&piprop=original&exintro=1&explaintext=1&exsentences=4`);
const p=Object.values(r.query?.pages||{})[0];if(!p||!document.getElementById('fiche'))return;
if(p.original?.source)document.getElementById('pos').outerHTML=`<img class="poster" src="${p.original.source}" alt="Affiche ${esc(f.t)}">`;
if(p.extract)document.getElementById('syn').textContent=p.extract;
document.getElementById('src').innerHTML=`Fiche : <a style="color:#7d6f99" target="_blank" href="${p.fullurl}">Wikipédia</a> / Wikidata`;
const q=p.pageprops?.wikibase_item;if(!q)return;
const c=(await J(`https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=claims&ids=${q}`)).entities[q].claims;
const ids=k=>(c[k]||[]).map(x=>x.mainsnak.datavalue?.value?.id).filter(Boolean);
const d=ids('P57'),ca=ids('P161').slice(0,5),all=[...d,...ca];
const dur=c.P2047?.[0]?.mainsnak.datavalue?.value?.amount;if(dur){const m=Math.round(+dur);document.getElementById('dur').textContent=`${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`}
const imdb=c.P345?.[0]?.mainsnak.datavalue?.value;if(imdb)document.getElementById('note').innerHTML=`<a target="_blank" href="https://www.imdb.com/title/${imdb}/">⭐ Note IMDb</a>`;
if(!all.length)return;const L=(await J(`https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=labels&languages=fr|en&ids=${all.join('|')}`)).entities;
const n=i=>esc(L[i]?.labels?.fr?.value||L[i]?.labels?.en?.value||'');
if(d.length)document.getElementById('dir').innerHTML=`<b>Réalisation :</b> ${d.map(n).join(', ')}`;
if(ca.length)document.getElementById('cast').innerHTML=`<b>Avec :</b> ${ca.map(n).join(', ')}`;
}catch(e){}}
ask();

</script></body></html>
